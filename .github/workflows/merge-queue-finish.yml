name: merge-queue-finish
# Shared merge queue, step 2 of 2. Merges or rejects the PR that prepare picked, then keeps the
# queue moving. Called from each repo's merge-queue.yml. How it works: merge-queue/README.md.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number from prepare.
        type: string
        required: true
      head_sha:
        description: PR head SHA from prepare.
        type: string
        required: false
        default: ''
      base_sha:
        description: Default-branch SHA the test merge was built on.
        type: string
        required: false
        default: ''
      state:
        description: State from prepare (ready, test, conflict, invalid).
        type: string
        required: true
      test_result:
        description: success or failure of this repo's CI on the test merge.
        type: string
        required: false
        default: failure
      post_merge:
        description: Space-separated workflow files to start on the default branch after a merge.
        type: string
        required: false
        default: ''
      label:
        description: Label that queues a PR.
        type: string
        required: false
        default: merge-queue
      status_context:
        description: Commit status the queue sets right before it merges.
        type: string
        required: false
        default: merge-queue

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # merge the PR
      pull-requests: write  # merge, comment, remove the label
      statuses: write       # set the merge-queue status
      actions: write        # start post-merge workflows and the next queue run
      checks: read          # PR head check runs
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      STATE: ${{ inputs.state }}
      TEST_RESULT: ${{ inputs.test_result }}
      POST_MERGE: ${{ inputs.post_merge }}
      LABEL: ${{ inputs.label }}
      STATUS_CONTEXT: ${{ inputs.status_context }}
      # The caller's workflow file, so the queue can start itself again.
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      # How long to wait for the PR's own required checks before merging.
      CHECKS_WAIT_SECONDS: '1800'
    steps:
      - name: Merge or reject the PR
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Input pr must be a PR number, got '$PR'."
            exit 1
          fi
          uri() { jq -rn --arg s "$1" '$s|@uri'; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          base_branch=$(gh api "repos/$REPO" --jq .default_branch)
          if [ "$base_branch" = main ]; then base_name=Main; else base_name="\`$base_branch\`"; fi

          # Post a comment once. The hidden marker makes re-runs skip it.
          comment_once() {
            local key=$1 body=$2 marker existing
            marker="<!-- merge-queue:$key -->"
            existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body')
            if grep -qF -- "$marker" <<< "$existing"; then
              echo "Comment '$key' already posted."
              return 0
            fi
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body
          $marker" > /dev/null
          }

          set_status() {  # state, description
            [ -n "$HEAD_SHA" ] || return 0
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$1" -f context="$STATUS_CONTEXT" \
              -f description="${2:0:140}" -f target_url="$run_url" > /dev/null
            echo "Status $STATUS_CONTEXT=$1 on ${HEAD_SHA:0:7}."
          }

          remove_label() {
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$(uri "$LABEL")" > /dev/null 2>&1 || true
            echo "Label '$LABEL' removed from #$PR."
          }

          # Take the PR out of the queue: failure status, no label, one plain comment.
          reject() {  # key, message
            set_status failure "Not merged. See the PR comment."
            remove_label
            comment_once "reject:$1:$GITHUB_RUN_ID" "$2 [Run]($run_url)"
          }

          # Required checks on the default branch (classic protection + rulesets), minus our own.
          required_contexts() {
            {
              gh api "repos/$REPO/branches/$(uri "$base_branch")" \
                --jq '.protection.required_status_checks.contexts[]?' 2>/dev/null || true
              gh api "repos/$REPO/rules/branches/$(uri "$base_branch")" \
                --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' 2>/dev/null || true
            } | grep -vxF -- "$STATUS_CONTEXT" | sort -u || true
          }

          # success, pending or failure for one check name on one commit.
          context_state() {
            local sha=$1 ctx=$2 run st
            run=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=$(uri "$ctx")&filter=latest&per_page=100" \
              --jq '.check_runs | sort_by(.id) | last | if . == null then "" else "\(.status):\(.conclusion // "")" end')
            case "$run" in
              completed:success|completed:neutral|completed:skipped) echo success; return ;;
              completed:*) echo failure; return ;;
              ?*) echo pending; return ;;
            esac
            st=$(gh api "repos/$REPO/commits/$sha/status" | jq -r --arg c "$ctx" \
              '[.statuses[] | select(.context == $c)] | first | .state // ""')
            case "$st" in
              success) echo success ;;
              failure|error) echo failure ;;
              *) echo pending ;;
            esac
          }

          # Sets checks_state (success, pending, failure, unknown) and failed_checks for a commit.
          check_required() {
            local sha=$1 ctx s
            local -a ctxs
            checks_state=success
            failed_checks=""
            if [ -z "$required" ]; then
              checks_state=unknown
              return
            fi
            mapfile -t ctxs <<< "$required"
            for ctx in "${ctxs[@]}"; do
              s=$(context_state "$sha" "$ctx")
              echo "  $ctx: $s"
              if [ "$s" = failure ]; then
                checks_state=failure
                failed_checks="${failed_checks:+$failed_checks, }$ctx"
              elif [ "$s" = pending ] && [ "$checks_state" != failure ]; then
                checks_state=pending
              fi
            done
          }

          pull=$(gh api "repos/$REPO/pulls/$PR")
          pr_state=$(jq -r .state <<< "$pull")
          merged=$(jq -r .merged <<< "$pull")
          cur_head=$(jq -r .head.sha <<< "$pull")
          echo "PR #$PR: state=$pr_state merged=$merged head=$cur_head queue state=$STATE test_result=$TEST_RESULT"

          # Closed or merged some other way: just take it out of the queue.
          if [ "$pr_state" != open ]; then
            echo "PR #$PR is no longer open (merged=$merged)."
            remove_label
            exit 0
          fi

          case "$STATE" in
            conflict)
              reject conflict "This PR conflicts with $base_branch. Update the branch, then add the \`$LABEL\` label again."
              exit 0 ;;

            invalid)
              draft=$(jq -r .draft <<< "$pull")
              pr_base=$(jq -r .base.ref <<< "$pull")
              head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pull")
              if [ "$draft" = true ]; then
                reason="This PR is a draft. Mark it ready for review, then add the \`$LABEL\` label again."
              elif [ "$pr_base" != "$base_branch" ]; then
                reason="This PR targets \`$pr_base\`. The queue only merges into \`$base_branch\`."
              elif [ "$head_repo" != "$REPO" ]; then
                reason="This PR comes from a fork. The queue only merges branches in this repo."
              else
                required=$(required_contexts)
                check_required "$cur_head"
                case "$checks_state" in
                  failure) reason="A required check failed on this PR: $failed_checks. Fix it, then add the \`$LABEL\` label again." ;;
                  pending) reason="This PR's checks hadn't passed yet. Add the \`$LABEL\` label again once they pass." ;;
                  *) reason="The queue couldn't check this PR. Add the \`$LABEL\` label again to retry." ;;
                esac
              fi
              reject invalid "$reason"
              exit 0 ;;

            ready|test) ;;

            *)
              echo "::warning::Unknown state '$STATE'. Nothing to do."
              exit 0 ;;
          esac

          if [ "$STATE" = test ] && [ "$TEST_RESULT" != success ]; then
            reject tests "Tests failed against $base_branch \`${BASE_SHA:0:7}\`. Fix them, then add the \`$LABEL\` label again."
            exit 0
          fi

          # 1. The PR's own required checks must be green on its head, or GitHub won't merge.
          required=$(required_contexts)
          echo "Required checks besides '$STATUS_CONTEXT': ${required//$'\n'/, }"
          waited=0
          while :; do
            check_required "$HEAD_SHA"
            [ "$checks_state" != pending ] && break
            if [ "$waited" -ge "$CHECKS_WAIT_SECONDS" ]; then
              break
            fi
            sleep 20
            waited=$((waited + 20))
          done
          if [ "$checks_state" = failure ]; then
            reject checks "Tests passed against $base_branch, but a required check failed on this PR: $failed_checks. Fix it, then add the \`$LABEL\` label again."
            exit 0
          fi
          if [ "$checks_state" = pending ]; then
            reject checks-timeout "Tests passed against $base_branch, but this PR's own checks didn't finish in time. Add the \`$LABEL\` label again once they pass."
            exit 0
          fi

          # 2. Still queued, and nothing moved while we tested.
          pull=$(gh api "repos/$REPO/pulls/$PR")
          if ! jq -e --arg l "$LABEL" 'any(.labels[]; .name == $l)' <<< "$pull" > /dev/null; then
            echo "Someone removed the '$LABEL' label while testing. Leaving PR #$PR alone."
            exit 0
          fi
          cur_head=$(jq -r .head.sha <<< "$pull")
          cur_base=$(gh api "repos/$REPO/git/ref/heads/$(uri "$base_branch")" --jq .object.sha)
          if [ "$cur_head" != "$HEAD_SHA" ]; then
            echo "PR head moved: $HEAD_SHA -> $cur_head."
            comment_once "moved-head:$HEAD_SHA:$BASE_SHA" "This PR changed while testing. Testing again."
            exit 0
          fi
          if [ "$cur_base" != "$BASE_SHA" ]; then
            echo "$base_branch moved: $BASE_SHA -> $cur_base."
            comment_once "moved-base:$HEAD_SHA:$BASE_SHA" "$base_name moved while testing. Testing again."
            exit 0
          fi

          # 3. Mark it tested, then merge with the head pinned.
          set_status success "Tested against $base_branch ${BASE_SHA:0:7}"
          title=$(gh api "repos/$REPO/pulls/$PR" --jq .title)
          err_file="$RUNNER_TEMP/merge-error.txt"
          if out=$(gh api -X PUT "repos/$REPO/pulls/$PR/merge" \
                -f merge_method=squash -f sha="$HEAD_SHA" -f commit_title="$title (#$PR)" 2> "$err_file"); then
            merged_sha=$(jq -r .sha <<< "$out")
            echo "Merged #$PR as $merged_sha."
            remove_label
            comment_once "merged" "Merged as \`${merged_sha:0:7}\`."
            # Merges made with the workflow token don't fire push workflows, so start them here.
            for wf in $POST_MERGE; do
              if gh workflow run "$wf" -R "$REPO" --ref "$base_branch"; then
                echo "Started $wf on $base_branch."
              else
                echo "::warning::Couldn't start $wf on $base_branch."
              fi
            done
            exit 0
          fi

          # The merge was refused.
          message=$(jq -r '.message // empty' <<< "${out:-}" 2>/dev/null || true)
          [ -n "$message" ] || message=$(cat "$err_file")
          echo "GitHub refused the merge: $message"
          touches_workflows=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | grep -c '^\.github/workflows/' || true)
          if grep -qi 'workflow' <<< "$message" || [ "${touches_workflows:-0}" -gt 0 ]; then
            # The workflow token can't merge workflow changes. Keep the success status for a person.
            remove_label
            comment_once "workflows:$HEAD_SHA:$BASE_SHA" "Tests passed against $base_branch. GitHub doesn't let the queue merge workflow changes: merge it with \`gh pr merge $PR --squash\`."
            exit 0
          fi
          if grep -qiE 'base branch was modified|head branch was modified' <<< "$message"; then
            comment_once "moved-base:$HEAD_SHA:$BASE_SHA" "$base_name moved while testing. Testing again."
            exit 0
          fi
          reject refused "Tests passed, but GitHub refused the merge: $message"

      - name: Continue the queue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base_branch=$(gh api "repos/$REPO" --jq .default_branch)
          queue_workflow=${CALLER_WORKFLOW_REF%@*}
          queue_workflow=${queue_workflow##*/}
          [ -n "$queue_workflow" ] || queue_workflow=merge-queue.yml
          waiting=$(gh api graphql \
            -f owner="${REPO%%/*}" -f name="${REPO#*/}" -f label="$LABEL" \
            -f query='
              query($owner: String!, $name: String!, $label: String!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: OPEN, labels: [$label]) { totalCount }
                }
              }' --jq '.data.repository.pullRequests.totalCount')
          echo "$waiting PR(s) still queued."
          if [ "$waiting" -gt 0 ]; then
            gh workflow run "$queue_workflow" -R "$REPO" --ref "$base_branch"
            echo "Started $queue_workflow again on $base_branch."
          fi
